name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24.x
          - os: ubuntu-latest
            node: 26.x
          - os: windows-latest
            node: 24.x
          - os: macos-latest
            node: 24.x
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.15.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run accuracy
      - run: pnpm run smoke:agent
      - run: pnpm run verify:pack
